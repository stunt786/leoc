<!-- View Modal -->
<div class="modal fade" id="viewModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title"><i class="bi bi-eye me-2"></i>Record Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="viewModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
// ========== VALIDATION HELPERS ==========
function validateEmail(email) {
  if (!email) return true;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function validatePhone(phone) {
  if (!phone) return true;
  return /^[\d\s\+\-\(\)]{7,20}$/.test(phone);
}

function validateCoordinates(coords) {
  if (!coords) return true;
  const parts = coords.split(',').map(s => s.trim());
  if (parts.length !== 2) return false;
  const lat = parseFloat(parts[0]), lng = parseFloat(parts[1]);
  if (isNaN(lat) || isNaN(lng)) return false;
  if (lat < -90 || lat > 90) return false;
  if (lng < -180 || lng > 180) return false;
  return true;
}

function validateNepaliPhone(phone) {
  if (!phone) return true;
  return /^(\+977[- ]?)?(9[678]\d{8}|0[1-9]\d{7,9})$/.test(phone.replace(/\s/g, ''));
}

function validateRequired(val, fieldName) {
  if (!val || !val.toString().trim()) {
    showToast('danger', fieldName + ' is required');
    return false;
  }
  return true;
}

function validateFormFields(rules) {
  for (const rule of rules) {
    const el = document.getElementById(rule.id);
    if (!el) continue;
    const val = el.value;
    if (rule.required && !validateRequired(val, rule.label)) return false;
    if (rule.email && !validateEmail(val)) {
      showToast('danger', 'Invalid email format for ' + rule.label);
      return false;
    }
    if (rule.phone && !validatePhone(val)) {
      showToast('danger', 'Invalid phone format for ' + rule.label);
      return false;
    }
    if (rule.nepaliPhone && !validateNepaliPhone(val)) {
      showToast('danger', 'Invalid Nepali phone number for ' + rule.label);
      return false;
    }
    if (rule.coordinates && !validateCoordinates(val)) {
      showToast('danger', 'Invalid coordinates format for ' + rule.label + ' (use Lat, Lng)');
      return false;
    }
    if (rule.min !== undefined && parseFloat(val) < rule.min) {
      showToast('danger', rule.label + ' must be at least ' + rule.min);
      return false;
    }
    if (rule.max !== undefined && parseFloat(val) > rule.max) {
      showToast('danger', rule.label + ' must be at most ' + rule.max);
      return false;
    }
  }
  return true;
}

// ========== VIEW MODAL ==========
function showViewModal(title, fields) {
  const body = document.getElementById('viewModalBody');
  body.innerHTML = '<div class="card"><div class="card-header bg-light"><strong><i class="bi bi-info-circle me-2"></i>' + title + '</strong></div><div class="card-body"><div class="row">';
  fields.forEach(f => {
    if (f.hidden && !f.value) return;
    const val = f.value || '-';
    const badgeClass = f.badge || '';
    const formattedVal = badgeClass ? '<span class="badge ' + badgeClass + '">' + val + '</span>' : val;
    body.innerHTML += '<div class="col-md-6 mb-2"><small class="text-muted d-block">' + f.label + '</small><strong>' + formattedVal + '</strong></div>';
  });
  body.innerHTML += '</div></div></div>';
  new bootstrap.Modal(document.getElementById('viewModal')).show();
}

// ========== PRINT FUNCTIONALITY ==========
function getPrintStyles() {
  return `<style>
    @page { size: A4 landscape; margin: 10mm; }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; padding: 15px; color: #333; }
    .print-header { text-align: center; margin-bottom: 15px; border-bottom: 2px solid #0d6efd; padding-bottom: 10px; }
    .print-header h2 { margin: 0; font-size: 20px; color: #0d6efd; }
    .print-header .print-meta { font-size: 12px; color: #666; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    table thead { background: #0d6efd; color: #fff; }
    table th, table td { border: 1px solid #999; padding: 5px 6px; text-align: left; word-break: break-word; }
    table th { font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; font-size: 10px; }
    table tbody tr:nth-child(even) { background: #f8f9fa; }
    table tbody tr:hover { background: #e9ecef; }
    .badge { display: inline-block; padding: 1px 6px; font-size: 10px; border-radius: 3px; color: #fff; }
    .bg-success { background: #198754; }
    .bg-danger { background: #dc3545; }
    .bg-warning { background: #ffc107; color: #333; }
    .bg-info { background: #0dcaf0; color: #000; }
    .bg-secondary { background: #6c757d; }
    .text-muted { color: #6c757d; }
    @media print {
      body { padding: 0; }
      .no-print { display: none !important; }
      table { font-size: 10px; }
      table th, table td { padding: 3px 4px; }
    }
  </style>`;
}

function getBootstrapStyles() {
  const styles = document.querySelectorAll('link[rel="stylesheet"]');
  let html = '';
  styles.forEach(s => { if (s.href && s.href.includes('bootstrap')) html += s.outerHTML; });
  return html;
}

function stripActionsColumn(tbl) {
  const clone = tbl.cloneNode(true);
  const headerRow = clone.querySelector('thead tr');
  if (headerRow) {
    const lastTh = headerRow.querySelector('th:last-child');
    if (lastTh && /actions/i.test(lastTh.textContent)) lastTh.remove();
  }
  clone.querySelectorAll('tbody tr').forEach(tr => {
    const cells = tr.querySelectorAll('td');
    const lastTd = cells[cells.length - 1];
    if (lastTd) {
      const thCount = clone.querySelector('thead tr') ? clone.querySelector('thead tr').children.length : 0;
      if (cells.length > thCount) lastTd.remove();
    }
  });
  return clone;
}

function printData(title) {
  const table = document.getElementById('dataTable') || document.querySelector('table');
  if (!table) { showToast('danger', 'No data table found to print'); return; }
  const cleanTable = stripActionsColumn(table);
  const win = window.open('', '_blank');
  win.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">');
  win.document.write('<title>' + (title || 'Data Report') + '</title>');
  win.document.write(getBootstrapStyles());
  win.document.write(getPrintStyles());
  win.document.write('</head><body>');
  win.document.write('<div class="print-header"><h2>' + (title || 'Data Report') + '</h2><div class="print-meta">Generated: ' + new Date().toLocaleString() + '</div></div>');
  win.document.write(cleanTable.outerHTML);
  win.document.write('</body></html>');
  win.document.close();
  setTimeout(() => { win.print(); win.close(); }, 500);
}

function printFilteredData(title, data, columns) {
  if (!data || data.length === 0) { showToast('danger', 'No data to print'); return; }
  const win = window.open('', '_blank');
  let tableHTML = '<table><thead><tr>';
  columns.forEach(c => { tableHTML += '<th>' + c + '</th>'; });
  tableHTML += '</tr></thead><tbody>';
  data.forEach(row => {
    tableHTML += '<tr>';
    columns.forEach(c => { tableHTML += '<td>' + (row[c] || '-') + '</td>'; });
    tableHTML += '</tr>';
  });
  tableHTML += '</tbody></table>';
  win.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">');
  win.document.write('<title>' + (title || 'Filtered Data') + '</title>');
  win.document.write(getBootstrapStyles());
  win.document.write(getPrintStyles());
  win.document.write('</head><body>');
  win.document.write('<div class="print-header"><h2>' + (title || 'Filtered Data') + '</h2><div class="print-meta">Generated: ' + new Date().toLocaleString() + ' | Records: ' + data.length + '</div></div>');
  win.document.write(tableHTML);
  win.document.write('</body></html>');
  win.document.close();
  setTimeout(() => { win.print(); win.close(); }, 500);
}
</script>
