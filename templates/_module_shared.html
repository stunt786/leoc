<!-- View Modal -->
<div class="modal fade" id="viewModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable view-modal-dialog">
    <div class="modal-content">
      <div class="view-modal-header">
        <div class="view-modal-title-wrap">
          <div class="view-logo-box" id="viewModalLogo">
            <i class="bi bi-eye"></i>
          </div>
          <h2 class="view-modal-heading" id="viewModalTitle">Record Details</h2>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button type="button" class="view-header-btn" onclick="printDetailedView()" title="Print"><i class="bi bi-printer"></i></button>
          <button type="button" class="view-close-btn" data-bs-dismiss="modal"><i class="bi bi-x-lg"></i></button>
        </div>
      </div>
      <div class="view-content-wrapper" id="viewModalBody"></div>
    </div>
  </div>
</div>

<script>
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ========== VALIDATION HELPERS ==========
function validateEmail(email) {
  if (!email) return true;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function validatePhone(phone) {
  if (!phone) return true;
  return /^[\d\s\+\-\(\)]{7,20}$/.test(phone);
}

function validateCoordinates(coords) {
  if (!coords) return true;
  const parts = coords.split(',').map(s => s.trim());
  if (parts.length !== 2) return false;
  const lat = parseFloat(parts[0]), lng = parseFloat(parts[1]);
  if (isNaN(lat) || isNaN(lng)) return false;
  if (lat < -90 || lat > 90) return false;
  if (lng < -180 || lng > 180) return false;
  return true;
}

function validateNepaliPhone(phone) {
  if (!phone) return true;
  return /^(\+977[- ]?)?(9[678]\d{8}|0[1-9]\d{7,9})$/.test(phone.replace(/\s/g, ''));
}

function validateRequired(val, fieldName) {
  if (!val || !val.toString().trim()) {
    showToast('danger', fieldName + ' is required');
    return false;
  }
  return true;
}

function validateFormFields(rules) {
  for (const rule of rules) {
    const el = document.getElementById(rule.id);
    if (!el) continue;
    const val = el.value;
    if (rule.required && !validateRequired(val, rule.label)) return false;
    if (rule.email && !validateEmail(val)) {
      showToast('danger', 'Invalid email format for ' + rule.label);
      return false;
    }
    if (rule.phone && !validatePhone(val)) {
      showToast('danger', 'Invalid phone format for ' + rule.label);
      return false;
    }
    if (rule.nepaliPhone && !validateNepaliPhone(val)) {
      showToast('danger', 'Invalid Nepali phone number for ' + rule.label);
      return false;
    }
    if (rule.coordinates && !validateCoordinates(val)) {
      showToast('danger', 'Invalid coordinates format for ' + rule.label + ' (use Lat, Lng)');
      return false;
    }
    if (rule.min !== undefined && parseFloat(val) < rule.min) {
      showToast('danger', rule.label + ' must be at least ' + rule.min);
      return false;
    }
    if (rule.max !== undefined && parseFloat(val) > rule.max) {
      showToast('danger', rule.label + ' must be at most ' + rule.max);
      return false;
    }
  }
  return true;
}

// ========== VIEW MODAL ==========
let _viewModalInstance = null;

function getViewModal() {
  const el = document.getElementById('viewModal');
  if (!_viewModalInstance) {
    _viewModalInstance = new bootstrap.Modal(el);
    el.addEventListener('hidden.bs.modal', function() {
      _viewModalInstance = null;
    });
    el.addEventListener('shown.bs.modal', function() {
      document.querySelectorAll('.modal-backdrop').forEach(b => {
        if (b.parentNode && b.parentNode.querySelectorAll('.modal-backdrop').length > 1) b.remove();
      });
    });
  }
  return _viewModalInstance;
}

function showViewModal(title, fieldsOrGroups) {
  getViewModal().hide();
  document.getElementById('viewModalTitle').textContent = esc(title);
  document.getElementById('viewModalLogo').innerHTML = '<i class="fas fa-eye"></i>';
  const isGrouped = Array.isArray(fieldsOrGroups) && fieldsOrGroups.length > 0 && fieldsOrGroups[0].fields;
  const body = document.getElementById('viewModalBody');
  body.innerHTML = '<div class="row g-4">';
  if (isGrouped) {
    fieldsOrGroups.forEach(g => {
      if ((!g.fields || g.fields.length === 0) && (!g.rows || g.rows.length === 0)) return;

      if (g.layout === 'grid') {
        let html = '<div class="col-12"><div class="card border shadow-sm"><div class="card-header bg-light py-2 border-bottom"><strong class="small text-uppercase text-muted"><i class="bi bi-info-circle me-1"></i> ' + esc(g.title) + '</strong></div><div class="card-body p-4"><div class="row g-3">';
        g.fields.forEach(f => {
          if (f.hidden && !f.value) return;
          const val = f.value || '-';
          const badgeClass = f.badge || '';
          const formattedVal = badgeClass ? '<span class="badge ' + badgeClass + '">' + val + '</span>' : val;
          const colClass = f.fullWidth ? 'col-12' : 'col-md-6';
          html += '<div class="' + colClass + '"><div class="view-field-row"><span class="view-field-label">' + esc(f.label) + '</span><span class="view-field-value">' + formattedVal + '</span></div></div>';
        });
        html += '</div></div></div></div>';
        body.innerHTML += html;
      } else if (g.layout === 'table') {
        let html = '<div class="col-12"><div class="card border shadow-sm"><div class="card-header bg-light py-2 border-bottom"><strong class="small text-uppercase text-muted"><i class="bi bi-table me-1"></i> ' + esc(g.title) + '</strong></div><div class="card-body p-0"><table class="table table-sm table-bordered mb-0"><thead class="table-light"><tr>';
        (g.columns || []).forEach(c => {
          html += '<th class="small text-muted fw-semibold" style="padding:10px 14px">' + esc(c) + '</th>';
        });
        html += '</tr></thead><tbody>';
        if (!g.rows || g.rows.length === 0) {
          html += '<tr><td colspan="' + (g.columns || []).length + '" class="text-center text-muted small py-3">No data</td></tr>';
        } else {
          g.rows.forEach(row => {
            html += '<tr>';
            (g.columns || []).forEach((c, i) => {
              const val = (row[i] !== undefined && row[i] !== null) ? row[i] : '-';
              html += '<td style="padding:10px 14px;font-weight:500">' + val + '</td>';
            });
            html += '</tr>';
          });
        }
        html += '</tbody></table></div></div></div>';
        body.innerHTML += html;
      } else {
        body.innerHTML += '<div class="col-12"><div class="card border shadow-sm"><div class="card-header bg-light py-2 border-bottom"><strong class="small text-uppercase text-muted"><i class="bi bi-info-circle me-1"></i> ' + esc(g.title) + '</strong></div><div class="card-body p-0"><table class="table table-sm table-bordered mb-0"><tbody>';
        g.fields.forEach(f => {
          if (f.hidden && !f.value) return;
          const val = f.value || '-';
          const badgeClass = f.badge || '';
          const formattedVal = badgeClass ? '<span class="badge ' + badgeClass + '">' + val + '</span>' : val;
          body.innerHTML += '<tr><th class="text-muted small fw-normal" style="width:30%;background:#fafafa;vertical-align:middle;padding:8px 12px">' + esc(f.label) + '</th><td style="padding:8px 12px;font-weight:500">' + formattedVal + '</td></tr>';
        });
        body.innerHTML += '</tbody></table></div></div></div>';
      }
    });
  } else {
    const fields = fieldsOrGroups;
    body.innerHTML += '<div class="col-12"><div class="card border shadow-sm"><div class="card-body p-0"><table class="table table-sm table-bordered mb-0"><tbody>';
    fields.forEach(f => {
      if (f.hidden && !f.value) return;
      const val = f.value || '-';
      const badgeClass = f.badge || '';
      const formattedVal = badgeClass ? '<span class="badge ' + badgeClass + '">' + val + '</span>' : val;
      body.innerHTML += '<tr><th class="text-muted small fw-normal" style="width:30%;background:#fafafa;vertical-align:middle;padding:8px 12px">' + f.label + '</th><td style="padding:8px 12px;font-weight:500">' + formattedVal + '</td></tr>';
    });
    body.innerHTML += '</tbody></table></div></div></div>';
  }
  body.innerHTML += '</div>';
  setTimeout(() => getViewModal().show(), 150);
}

// ========== DETAILED VIEW MODAL (DESIGN VIEW) ==========
var _lastDetailedConfig = null;

function renderDetailedBody(config) {
  const body = document.getElementById('viewModalBody');
  let html = '';

  if (config.hero) {
    const hero = config.hero;
    const hIcon = hero.icon || 'fa-building';
    const hName = hero.name || config.title;
    const hSub = hero.subtitle || '';
    const hStatus = hero.status || '';
    const hBadge = hero.badgeClass || 'view-badge-success';
    html += '<div class="view-hero-card">';
    html += '  <div class="view-hero-left">';
    html += '    <div class="view-hero-icon"><i class="bi ' + hIcon + '"></i></div>';
    html += '    <div class="view-hero-info">';
    html += '      <h3>' + esc(hName) + '</h3>';
    html += '      <p>' + esc(hSub) + '</p>';
    html += '    </div>';
    html += '  </div>';
    if (hStatus) {
      html += '  <div class="view-status-badge ' + hBadge + '">\u25CF ' + esc(hStatus) + '</div>';
    }
    html += '</div>';
  }

  if (config.sections && config.sections.length > 0) {
    html += '<div class="view-grid">';
    config.sections.forEach(function(section) {
      var secFull = section.fullWidth || section.table ? ' view-card-full' : '';
      html += '<div class="view-info-card' + secFull + '">';
      html += '  <div class="view-section-header">';
      const sIcon = section.icon || 'fa-circle-info';
      html += '    <div class="view-section-icon"><i class="bi ' + sIcon + '"></i></div>';
      html += '    <h4>' + esc(section.title) + '</h4>';
      html += '  </div>';

      if (section.items && section.items.length > 0) {
        const cols = section.columns || 3;
        html += '  <div class="view-info-row" style="grid-template-columns:repeat(' + cols + ',1fr)">';
        section.items.forEach(function(item) {
          if (item.hidden && !item.value) return;
          const val = item.value || '-';
          const fw = item.fullWidth ? ' view-full-width' : '';
          const formatted = item.badge ? '<span class="badge ' + item.badge + '">' + val + '</span>' : esc(val);
          html += '    <div class="view-info-item' + fw + '">';
          html += '      <label>' + esc(item.label) + '</label>';
          html += '      <span>' + formatted + '</span>';
          html += '    </div>';
        });
        html += '  </div>';
      }

      if (section.tags && section.tags.length > 0) {
        html += '  <div class="view-amenities">';
        section.tags.forEach(function(tag) {
          html += '    <div class="view-tag"><i class="bi ' + tag.icon + '"></i> ' + esc(tag.text) + '</div>';
        });
        html += '  </div>';
      }

      if (section.table && section.table.columns && section.table.columns.length > 0) {
        html += '  <div class="view-table-wrap"><table class="view-table"><thead><tr>';
        section.table.columns.forEach(function(c) { html += '<th>' + esc(c) + '</th>'; });
        html += '</tr></thead><tbody>';
        if (!section.table.rows || section.table.rows.length === 0) {
          html += '<tr><td colspan="' + section.table.columns.length + '" class="text-center text-muted small py-2">No records</td></tr>';
        } else {
          section.table.rows.forEach(function(row) {
            html += '<tr>';
            row.forEach(function(cell) { html += '<td>' + (cell != null ? cell : '-') + '</td>'; });
            html += '</tr>';
          });
        }
        html += '</tbody></table></div>';
      }

      html += '</div>';
    });
    html += '</div>';
  }

  if (config.tags && config.tags.length > 0) {
    html += '<div class="view-info-card view-tags-card">';
    html += '  <div class="view-section-header">';
    html += '    <div class="view-section-icon"><i class="bi bi-building"></i></div>';
    html += '    <h4>Available Amenities</h4>';
    html += '  </div>';
    html += '  <div class="view-amenities">';
    config.tags.forEach(function(tag) {
      html += '    <div class="view-tag"><i class="bi ' + tag.icon + '"></i> ' + esc(tag.text) + '</div>';
    });
    html += '  </div>';
    html += '</div>';
  }

  if (config.footer && config.footer.length > 0) {
    html += '<div class="view-footer-meta">';
    html += '  <div class="view-meta-grid">';
    config.footer.forEach(function(item) {
      html += '    <div class="view-meta-item">';
      html += '      <div class="view-meta-icon"><i class="bi ' + item.icon + '"></i></div>';
      html += '      <div>';
      html += '        <h5>' + esc(item.label) + '</h5>';
      html += '        <p>' + esc(item.value || '-') + '</p>';
      html += '      </div>';
      html += '    </div>';
    });
    html += '  </div>';
    html += '</div>';
  }

  body.innerHTML = html;
}

function showDetailedViewModal(config) {
  getViewModal().hide();
  _lastDetailedConfig = config;
  document.getElementById('viewModalTitle').textContent = esc(config.title || '');
  if (config.logo) {
    document.getElementById('viewModalLogo').innerHTML = '<i class="bi ' + config.logo + '"></i>';
  } else {
    document.getElementById('viewModalLogo').innerHTML = '<i class="bi bi-eye"></i>';
  }
  renderDetailedBody(config);
  setTimeout(function() { getViewModal().show(); }, 150);
}

function printDetailedView() {
  var cfg = _lastDetailedConfig;
  if (!cfg) { showToast('danger', 'No data to print'); return; }
  var logoHtml = cfg.logo ? '<i class="bi ' + cfg.logo + '"></i>' : '<i class="bi bi-eye"></i>';
  var win = window.open('', '_blank');
  win.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(cfg.title || 'Record') + ' - Print</title>');
  win.document.write('<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">');
  win.document.write('<style>');
  win.document.write('*{margin:0;padding:0;box-sizing:border-box}');
  win.document.write('body{font-family:Inter,Segoe UI,sans-serif;color:#1f2937;padding:30px;background:#fff}');
  win.document.write('.print-header{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:2px solid #6d4aff;margin-bottom:20px}');
  win.document.write('.print-logo{width:40px;height:40px;background:linear-gradient(135deg,#7c5cff,#5a38ff);border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}');
  win.document.write('.print-header h1{font-size:22px;font-weight:700;color:#1f2937}');
  win.document.write('.print-meta{font-size:12px;color:#6b7280;margin-top:20px;padding-top:12px;border-top:1px solid #e5e7eb;text-align:center}');
  win.document.write('.hero-card{background:#fafbff;border:1px solid #e5e7eb;border-radius:10px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}');
  win.document.write('.hero-left{display:flex;align-items:center;gap:12px}');
  win.document.write('.hero-icon{width:44px;height:44px;border-radius:50%;background:#f4f1ff;color:#6d4aff;display:flex;align-items:center;justify-content:center;font-size:20px}');
  win.document.write('.hero-info h3{font-size:18px;font-weight:700;margin:0 0 2px}');
  win.document.write('.hero-info p{font-size:12px;color:#6b7280;margin:0}');
  win.document.write('.status-badge{padding:5px 14px;border-radius:20px;font-weight:600;font-size:12px;white-space:nowrap}');
  win.document.write('.bg-green{background:#eafaf0;color:#15803d}.bg-red{background:#fef2f2;color:#dc2626}.bg-amber{background:#fffbeb;color:#b45309}.bg-blue{background:#eff6ff;color:#1d4ed8}');
  win.document.write('.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}');
  win.document.write('.card{border:1px solid #e5e7eb;border-radius:10px;padding:16px;background:#fff;break-inside:avoid}');
  win.document.write('.card.full{grid-column:1/-1}');
  win.document.write('.card h4{font-size:14px;font-weight:600;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid #e5e7eb}');
  win.document.write('.row{display:grid;gap:10px}');
  win.document.write('.field label{display:block;font-size:10.5px;color:#6b7280;font-weight:500;text-transform:uppercase;letter-spacing:0.3px;margin-bottom:3px}');
  win.document.write('.field span{font-size:13.5px;font-weight:600;color:#1f2937}');
  win.document.write('.full-w{grid-column:1/-1}');
  win.document.write('.tags{display:flex;flex-wrap:wrap;gap:8px}');
  win.document.write('.tag{padding:5px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:11.5px;font-weight:500;color:#4b5563;display:flex;align-items:center;gap:6px}');
  win.document.write('.tag i{color:#6d4aff;font-size:12px}');
  win.document.write('.ftr{margin-top:16px;border:1px solid #e5e7eb;border-radius:10px;padding:16px}');
  win.document.write('.ftr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}');
  win.document.write('.ftr-item{display:flex;align-items:center;gap:12px}');
  win.document.write('.ftr-icon{width:36px;height:36px;border-radius:50%;background:#f4f1ff;color:#6d4aff;display:flex;align-items:center;justify-content:center;font-size:14px}');
  win.document.write('.ftr-item h5{font-size:11px;color:#6b7280;font-weight:500;text-transform:uppercase;letter-spacing:0.3px;margin:0 0 2px}');
  win.document.write('.ftr-item p{font-size:13px;font-weight:600;color:#1f2937;margin:0}');
  win.document.write('table.view-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}');
  win.document.write('table.view-tbl th{background:#f8fafc;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:0.3px;color:#6b7280;padding:8px 10px;border:1px solid #e5e7eb;text-align:left}');
  win.document.write('table.view-tbl td{padding:7px 10px;border:1px solid #e5e7eb;color:#1f2937}');
  win.document.write('table.view-tbl tbody tr:nth-child(even){background:#fafafa}');
  win.document.write('@media print{body{padding:15px}.grid{break-inside:auto}.card{break-inside:avoid}}');
  win.document.write('@media(max-width:768px){.grid,.ftr-grid{grid-template-columns:1fr}.hero-card{flex-direction:column;gap:12px;text-align:center}.hero-left{flex-direction:column;text-align:center}}');
  win.document.write('</style></head><body>');

  win.document.write('<div class="print-header"><div class="print-logo">' + logoHtml + '</div><h1>' + esc(cfg.title || 'Record Details') + '</h1></div>');

  if (cfg.hero) {
    var h = cfg.hero;
    var hBadgeMap = {'view-badge-success':'bg-green','view-badge-danger':'bg-red','view-badge-warning':'bg-amber','view-badge-info':'bg-blue'};
    var pb = hBadgeMap[h.badgeClass] || 'bg-green';
    win.document.write('<div class="hero-card"><div class="hero-left"><div class="hero-icon"><i class="bi ' + (h.icon||'fa-building') + '"></i></div><div class="hero-info"><h3>' + esc(h.name||cfg.title) + '</h3><p>' + esc(h.subtitle||'') + '</p></div></div>');
    if (h.status) win.document.write('<div class="status-badge ' + pb + '">\u25CF ' + esc(h.status) + '</div>');
    win.document.write('</div>');
  }

  if (cfg.sections) {
    win.document.write('<div class="grid">');
    cfg.sections.forEach(function(s) {
      var isFull = s.table && s.table.columns && s.table.columns.length > 3;
      win.document.write('<div class="card' + (isFull ? ' full' : '') + '"><h4>' + esc(s.title) + '</h4>');
      if (s.items && s.items.length > 0) {
        var cols = s.columns || 3;
        win.document.write('<div class="row" style="grid-template-columns:repeat(' + cols + ',1fr)">');
        s.items.forEach(function(it) {
          var fw = it.fullWidth ? ' full-w' : '';
          win.document.write('<div class="field' + fw + '"><label>' + esc(it.label) + '</label><span>' + (it.value||'-') + '</span></div>');
        });
        win.document.write('</div>');
      }
      if (s.table && s.table.columns) {
        win.document.write('<table class="view-tbl"><thead><tr>');
        s.table.columns.forEach(function(c) { win.document.write('<th>' + esc(c) + '</th>'); });
        win.document.write('</tr></thead><tbody>');
        if (s.table.rows && s.table.rows.length > 0) {
          s.table.rows.forEach(function(r) {
            win.document.write('<tr>');
            r.forEach(function(c) { win.document.write('<td>' + (c!=null?c:'-') + '</td>'); });
            win.document.write('</tr>');
          });
        }
        win.document.write('</tbody></table>');
      }
      win.document.write('</div>');
    });
    win.document.write('</div>');
  }

  if (cfg.tags && cfg.tags.length > 0) {
    win.document.write('<div class="card" style="margin-top:16px"><h4>Available Amenities</h4><div class="tags">');
    cfg.tags.forEach(function(t) { win.document.write('<div class="tag"><i class="bi ' + t.icon + '"></i>' + esc(t.text) + '</div>'); });
    win.document.write('</div></div>');
  }

  if (cfg.footer && cfg.footer.length > 0) {
    win.document.write('<div class="ftr"><div class="ftr-grid">');
    cfg.footer.forEach(function(f) { win.document.write('<div class="ftr-item"><div class="ftr-icon"><i class="bi ' + f.icon + '"></i></div><div><h5>' + esc(f.label) + '</h5><p>' + esc(f.value||'-') + '</p></div></div>'); });
    win.document.write('</div></div>');
  }

  win.document.write('<div class="print-meta">Generated: ' + new Date().toLocaleString() + '</div>');
  win.document.write('</body></html>');
  win.document.close();
  setTimeout(function() { win.document.title += ' - Print Preview'; }, 200);
}

function showViewTable(title, columns, rows) {
  const body = document.getElementById('viewModalBody');
  let tableHtml = '<div class="col-12"><div class="card border shadow-sm"><div class="card-header bg-light py-2 border-bottom"><strong class="small text-uppercase text-muted"><i class="bi bi-table me-1"></i> ' + esc(title) + '</strong></div><div class="card-body p-0"><table class="table table-sm table-bordered mb-0"><thead class="table-light"><tr>';
  columns.forEach(c => { tableHtml += '<th class="small text-muted fw-semibold" style="padding:8px 12px">' + esc(c) + '</th>'; });
  tableHtml += '</tr></thead><tbody>';
  if (!rows || rows.length === 0) {
    tableHtml += '<tr><td colspan="' + columns.length + '" class="text-center text-muted small py-3">No records</td></tr>';
  } else {
    rows.forEach(row => {
      tableHtml += '<tr>';
      columns.forEach((c, i) => {
        tableHtml += '<td style="padding:8px 12px">' + (row[i] || '-') + '</td>';
      });
      tableHtml += '</tr>';
    });
  }
  tableHtml += '</tbody></table></div></div></div>';
  const wrap = body.querySelector('.row.g-3');
  if (wrap) wrap.innerHTML += tableHtml;
  else body.innerHTML += tableHtml;
}

// ========== PRINT FUNCTIONALITY ==========
function getPrintStyles() {
  return `<style>
    @page { size: A4 landscape; margin: 10mm; }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; padding: 15px; color: #333; }
    .print-header { text-align: center; margin-bottom: 15px; border-bottom: 2px solid #0d6efd; padding-bottom: 10px; }
    .print-header h2 { margin: 0; font-size: 20px; color: #0d6efd; }
    .print-header .print-meta { font-size: 12px; color: #666; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    table thead { background: #0d6efd; color: #fff; }
    table th, table td { border: 1px solid #999; padding: 5px 6px; text-align: left; word-break: break-word; }
    table th { font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; font-size: 10px; }
    table tbody tr:nth-child(even) { background: #f8f9fa; }
    table tbody tr:hover { background: #e9ecef; }
    .badge { display: inline-block; padding: 1px 6px; font-size: 10px; border-radius: 3px; color: #fff; }
    .bg-success { background: #198754; }
    .bg-danger { background: #dc3545; }
    .bg-warning { background: #ffc107; color: #333; }
    .bg-info { background: #0dcaf0; color: #000; }
    .bg-secondary { background: #6c757d; }
    .text-muted { color: #6c757d; }
    @media print {
      body { padding: 0; }
      .no-print { display: none !important; }
      table { font-size: 10px; }
      table th, table td { padding: 3px 4px; }
    }
  </style>`;
}

function getBootstrapStyles() {
  const styles = document.querySelectorAll('link[rel="stylesheet"]');
  let html = '';
  styles.forEach(s => { if (s.href && s.href.includes('bootstrap')) html += s.outerHTML; });
  return html;
}

function stripActionsColumn(tbl) {
  const clone = tbl.cloneNode(true);
  const headerRow = clone.querySelector('thead tr');
  if (headerRow) {
    const lastTh = headerRow.querySelector('th:last-child');
    if (lastTh && /actions/i.test(lastTh.textContent)) lastTh.remove();
  }
  clone.querySelectorAll('tbody tr').forEach(tr => {
    const cells = tr.querySelectorAll('td');
    const lastTd = cells[cells.length - 1];
    if (lastTd) {
      const thCount = clone.querySelector('thead tr') ? clone.querySelector('thead tr').children.length : 0;
      if (cells.length > thCount) lastTd.remove();
    }
  });
  return clone;
}

function printData(title) {
  const table = document.getElementById('dataTable') || document.querySelector('table');
  if (!table) { showToast('danger', 'No data table found to print'); return; }
  const cleanTable = stripActionsColumn(table);
  const win = window.open('', '_blank');
  win.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">');
  win.document.write('<title>' + (title || 'Data Report') + '</title>');
  win.document.write(getBootstrapStyles());
  win.document.write(getPrintStyles());
  win.document.write('</head><body>');
  win.document.write('<div class="print-header"><h2>' + (title || 'Data Report') + '</h2><div class="print-meta">Generated: ' + new Date().toLocaleString() + '</div></div>');
  win.document.write(cleanTable.outerHTML);
  win.document.write('</body></html>');
  win.document.close();
  setTimeout(() => { win.print(); win.close(); }, 500);
}

function printFilteredData(title, data, columns) {
  if (!data || data.length === 0) { showToast('danger', 'No data to print'); return; }
  const win = window.open('', '_blank');
  let tableHTML = '<table><thead><tr>';
  columns.forEach(c => { tableHTML += '<th>' + c + '</th>'; });
  tableHTML += '</tr></thead><tbody>';
  data.forEach(row => {
    tableHTML += '<tr>';
    columns.forEach(c => { tableHTML += '<td>' + (row[c] || '-') + '</td>'; });
    tableHTML += '</tr>';
  });
  tableHTML += '</tbody></table>';
  win.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">');
  win.document.write('<title>' + (title || 'Filtered Data') + '</title>');
  win.document.write(getBootstrapStyles());
  win.document.write(getPrintStyles());
  win.document.write('</head><body>');
  win.document.write('<div class="print-header"><h2>' + (title || 'Filtered Data') + '</h2><div class="print-meta">Generated: ' + new Date().toLocaleString() + ' | Records: ' + data.length + '</div></div>');
  win.document.write(tableHTML);
  win.document.write('</body></html>');
  win.document.close();
  setTimeout(() => { win.print(); win.close(); }, 500);
}

async function checkDuplicateRecords(endpoint, checks, excludeId, label) {
  try {
    const r = await fetch(endpoint);
    const d = await r.json();
    if (!d.success || !d.data) return null;
    const records = d.data;
    for (const record of records) {
      if (excludeId && String(record.id) === String(excludeId)) continue;
      for (const [field, value] of Object.entries(checks)) {
        if (!value) continue;
        if (String(record[field] || '').toLowerCase() === String(value).toLowerCase()) {
          return (label || 'A record') + ' with this ' + field.replace(/_/g, ' ') + ' already exists';
        }
      }
    }
  } catch (e) {}
  return null;
}
