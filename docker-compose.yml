services:
  leoc-db:
    image: postgres:16-alpine
    container_name: leoc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: leoc
      POSTGRES_USER: leoc
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - leoc_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leoc"]
      interval: 5s
      timeout: 5s
      retries: 5

  leoc-app:
    build: .
    image: leoc-app:latest
    container_name: leoc-app
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      - upload_data:/app/static/uploads
      - backup_data:/app/backups
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - SQLALCHEMY_DATABASE_URI=postgresql://leoc:${DB_PASSWORD}@leoc-db:5432/leoc
    depends_on:
      leoc-db:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  leoc-cron:
    build: .
    image: leoc-app:latest
    container_name: leoc-cron
    restart: unless-stopped
    entrypoint: ["/app/entrypoint-cron.sh"]
    volumes:
      - backup_data:/app/backups
    environment:
      - DB_HOST=leoc-db
      - DB_NAME=leoc
      - DB_USER=leoc
      - DB_PASSWORD=${DB_PASSWORD}
      - RETENTION_COUNT=7
      - CRON_SCHEDULE=0 2 * * *
    depends_on:
      leoc-db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  leoc_db_data:
  upload_data:
    driver_opts:
      type: none
      device: ${APP_DIR:-/home/thalaramun/leoc}/static/uploads
      o: bind
  backup_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.101.12,nolock,soft,rw,vers=3
      device: :/volume1/leoc-backups
