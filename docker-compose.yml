services:
  leoc-db:
    image: postgres:16-alpine
    container_name: leoc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: leoc
      POSTGRES_USER: leoc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leoc_prod_pass}
    volumes:
      - leoc_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leoc"]
      interval: 5s
      timeout: 5s
      retries: 5

  leoc-app:
    build: .
    image: leoc-app:latest
    container_name: leoc-app
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./backups:/app/backups
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-default-secret-key}
      - SQLALCHEMY_DATABASE_URI=postgresql://leoc:${DB_PASSWORD:-leoc_prod_pass}@leoc-db:5432/leoc
      - UPLOAD_FOLDER=/app/static/uploads
      - CACHE_TIMEOUT=300
    depends_on:
      leoc-db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  leoc_db_data:
  uploads:
